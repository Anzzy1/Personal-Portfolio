<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262a"/>
      <stop offset="1" stop-color="#0f0f11"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffa066"/>
      <stop offset="1" stop-color="#f2541b"/>
    </linearGradient>
  </defs>
  <!-- Ink tile with a hairline highlight, like the site's raised surfaces -->
  <rect width="64" height="64" rx="15" fill="url(#ink)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="14.25" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="1.5"/>
  <!-- Geometric lowercase "a" (ring + stem) followed by a tangerine terminal cursor: "a_" -->
  <circle cx="25" cy="32" r="10.5" fill="none" stroke="#fff" stroke-width="6.5"/>
  <path d="M35.5 21.5 V42.5" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
  <rect x="42.5" y="37" width="10" height="6.5" rx="1.6" fill="url(#signal)"/>
</svg>
